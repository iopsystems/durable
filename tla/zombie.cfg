\* Worker 1 may miss a heartbeat while it is still running, so worker 2
\* reaps it and takes over its task while worker 1 is still executing it.
\*
\* Expected (current code): AllTasksComplete is violated (#133). The
\* zombie's notification_blocking commit passes its running_on check on a
\* stale snapshot and consumes the notification after the new owner has
\* polled; the new owner then suspends the task with nothing to wake it.
\* Before #130 this config also found #125 and #126.
CONSTANTS
    Workers       = {1, 2}
    Tasks         = {1}
    Prog          <- WaitThenSleep
    MaxTasks      = 1
    CrashWorkers  = {}
    FlakyWorkers  = {1}
    MaxLate       = 1
    MaxTransient  = 1
    MaxReconnects = 1
    CommitLocksTask = FALSE
    Null          = Null

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoSpuriousFailure
    ExecsBehindLog

PROPERTIES
    FinalIsFinal
    AllTasksComplete
    DeadRowsReaped
