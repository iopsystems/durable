\* Worker 1 may miss a heartbeat while it is still running, so worker 2
\* reaps it and takes over its task while worker 1 is still executing it.
\*
\* Expected (current code): NoSpuriousFailure is violated. The zombie's
\* execution hits a primary key conflict on durable.event, or tries to
\* suspend a task that has already completed, and mark_task_failed then
\* fails the task.
CONSTANTS
    Workers       = {1, 2}
    Tasks         = {1}
    Prog          <- WaitThenSleep
    MaxTasks      = 1
    CrashWorkers  = {}
    FlakyWorkers  = {1}
    MaxLate       = 1
    MaxTransient  = 0
    MaxReconnects = 0
    Fenced        = FALSE
    Null          = Null

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoSpuriousFailure
    ExecsBehindLog

PROPERTIES
    FinalIsFinal
    AllTasksComplete
    DeadRowsReaped
