\* Worker 1 may miss a heartbeat while it is still running, so worker 2
\* reaps it and takes over its task while worker 1 is still executing it.
\*
\* Expected: all properties hold. Before #130 the zombie's writes were not
\* fenced on running_on, and TLC found traces that failed the task (#126)
\* or left it suspended forever (#125).
CONSTANTS
    Workers       = {1, 2}
    Tasks         = {1}
    Prog          <- WaitThenSleep
    MaxTasks      = 1
    CrashWorkers  = {}
    FlakyWorkers  = {1}
    MaxLate       = 1
    MaxTransient  = 1
    MaxReconnects = 1
    Null          = Null

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoSpuriousFailure
    ExecsBehindLog

PROPERTIES
    FinalIsFinal
    AllTasksComplete
    DeadRowsReaped
