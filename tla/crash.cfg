\* Worker 1 may crash; worker 2 is stable. Transient task errors and a
\* dropped LISTEN connection are allowed. No zombies.
\*
\* Expected: all properties hold.
CONSTANTS
    Workers       = {1, 2}
    Tasks         = {1, 2}
    Prog          <- WaitThenSleep
    MaxTasks      = 1
    CrashWorkers  = {1}
    FlakyWorkers  = {}
    MaxLate       = 0
    MaxTransient  = 1
    MaxReconnects = 1
    CommitLocksTask = FALSE
    Null          = Null

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoSpuriousFailure
    ExecsBehindLog

PROPERTIES
    FinalIsFinal
    AllTasksComplete
    DeadRowsReaped
