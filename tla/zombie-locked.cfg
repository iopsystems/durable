\* As zombie.cfg, with the proposed fix for the stale commit: the
\* current_task CTE in commit_event_with_log takes FOR SHARE on the task row.
\*
\* Expected: all properties hold.
CONSTANTS
    Workers       = {1, 2}
    Tasks         = {1}
    Prog          <- WaitThenSleep
    MaxTasks      = 1
    CrashWorkers  = {}
    FlakyWorkers  = {1}
    MaxLate       = 1
    MaxTransient  = 1
    MaxReconnects = 1
    CommitLocksTask = TRUE
    Null          = Null

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoSpuriousFailure
    ExecsBehindLog

PROPERTIES
    FinalIsFinal
    AllTasksComplete
    DeadRowsReaped
