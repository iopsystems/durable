\* As zombie.cfg, with the proposed fix: every write a task execution makes
\* to its own durable.task / durable.event rows is conditional on
\* running_on = this worker.
\*
\* Expected: all properties hold.
CONSTANTS
    Workers       = {1, 2}
    Tasks         = {1}
    Prog          <- WaitThenSleep
    MaxTasks      = 1
    CrashWorkers  = {}
    FlakyWorkers  = {1}
    MaxLate       = 1
    MaxTransient  = 1
    MaxReconnects = 1
    Fenced        = TRUE
    Null          = Null

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoSpuriousFailure
    ExecsBehindLog

PROPERTIES
    FinalIsFinal
    AllTasksComplete
    DeadRowsReaped
