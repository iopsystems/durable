\* As zombie.cfg, but only checks that tasks reach *some* final state, so
\* that TLC reports the stuck-task trace rather than the spurious failure.
\*
\* Expected (current code): AllTasksFinish is violated. The zombie's
\* try_suspend suspends the task after the new owner consumed the
\* notification it was waiting for; nothing ever wakes it again.
CONSTANTS
    Workers       = {1, 2}
    Tasks         = {1}
    Prog          <- WaitThenSleep
    MaxTasks      = 1
    CrashWorkers  = {}
    FlakyWorkers  = {1}
    MaxLate       = 1
    MaxTransient  = 0
    MaxReconnects = 0
    Fenced        = FALSE
    Null          = Null

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK

PROPERTIES
    AllTasksFinish
