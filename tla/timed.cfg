\* A timed notification wait (notification_blocking_timeout), with the same
\* faults as zombie.cfg. The notification may arrive before or after the
\* deadline, and the wait may suspend in between.
\*
\* Expected: all properties hold.
CONSTANTS
    Workers       = {1, 2}
    Tasks         = {1}
    Prog          <- TimedWait
    MaxTasks      = 1
    CrashWorkers  = {}
    FlakyWorkers  = {1}
    MaxLate       = 1
    MaxTransient  = 1
    MaxReconnects = 1
    CommitLocksTask = FALSE
    Null          = Null

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoSpuriousFailure
    ExecsBehindLog

PROPERTIES
    FinalIsFinal
    AllTasksComplete
    DeadRowsReaped
