[package]
name = "durable-cli"
version = "0.1.4"
edition = "2021"
license = { workspace = true }
publish = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
description = "CLI for interacting with a durable cluster"

[[bin]]
name = "durable"
path = "src/main.rs"

[dependencies]
durable-client = { workspace = true }

anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["env", "derive"] }
futures-util = "0.3.32"
log = "0.4.29"
serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["raw_value"] }
tabled = "0.21.0"
tokio = { version = "1.50.0", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dependencies.sqlx]
version = "0.9"
features = ["postgres", "runtime-tokio", "tls-rustls"]
