[package]
name = "durable-test"
version = "0.0.0"
edition = "2021"
publish = false
license = { workspace = true }

[dependencies]
durable-client = { workspace = true }
durable-runtime = { workspace = true }

anyhow = "1.0"
chrono = "0.4"
dotenvy = "0.15.7"
serde_json = "1.0.149"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.50", features = ["full", "macros"] }
wasmtime = { workspace = true }
futures = "0.3.32"
ctor = "1.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
